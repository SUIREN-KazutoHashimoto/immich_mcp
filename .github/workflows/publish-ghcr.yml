{
  "name": "Publish container to GHCR",
  "on": {
    "workflow_dispatch": {},
    "release": {
      "types": [
        "published"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "metadata": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "env": {
        "IMAGE": "ghcr.io/suiren-kazutohashimoto/immich-mcp",
        "GH_REPO": "${{ github.repository }}"
      },
      "outputs": {
        "version": "${{ steps.metadata.outputs.version }}",
        "image": "${{ steps.metadata.outputs.image }}"
      },
      "steps": [
        {
          "name": "Check out the selected revision",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.22.2"
          }
        },
        {
          "name": "Validate release version and event",
          "id": "metadata",
          "run": "node scripts/container-channels.ts metadata"
        }
      ]
    },
    "publish": {
      "needs": "metadata",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "concurrency": {
        "group": "publish-ghcr-${{ needs.metadata.outputs.version }}",
        "cancel-in-progress": false
      },
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "env": {
        "IMAGE": "ghcr.io/suiren-kazutohashimoto/immich-mcp",
        "GH_REPO": "${{ github.repository }}"
      },
      "steps": [
        {
          "name": "Check out the selected revision",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.22.2"
          }
        },
        {
          "name": "Install locked dependencies",
          "run": "npm install --global pnpm@11.25.0\npnpm install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Install the browser required by regression fixtures",
          "run": "pnpm exec playwright install --with-deps chromium"
        },
        {
          "name": "Generate, build and run the full regression suite",
          "run": "pnpm check"
        },
        {
          "name": "Authenticate to GHCR",
          "env": {
            "GHCR_TOKEN": "${{ github.token }}"
          },
          "run": "printf '%s' \"$GHCR_TOKEN\" | docker login ghcr.io --username \"$GITHUB_ACTOR\" --password-stdin"
        },
        {
          "name": "Preserve an existing fixed version",
          "id": "existing",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "node scripts/container-channels.ts prepare"
        },
        {
          "name": "Set up Docker Buildx",
          "if": "steps.existing.outputs.reuse != 'true'",
          "uses": "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069"
        },
        {
          "name": "Build Linux amd64 image",
          "if": "steps.existing.outputs.reuse != 'true'",
          "uses": "docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc",
          "with": {
            "context": ".",
            "file": "Dockerfile",
            "platforms": "linux/amd64",
            "load": true,
            "tags": "${{ needs.metadata.outputs.image }}",
            "labels": "org.opencontainers.image.source=https://github.com/SUIREN-KazutoHashimoto/immich_mcp\norg.opencontainers.image.revision=${{ github.sha }}",
            "provenance": false,
            "build-args": "MCP_BUILD_REVISION=${{ github.sha }}"
          }
        },
        {
          "name": "Run real-container smoke and restart",
          "env": {
            "PUBLISH_IMAGE": "${{ needs.metadata.outputs.image }}"
          },
          "run": "node scripts/container-smoke.mjs \"$PUBLISH_IMAGE\" \"$RUNNER_TEMP/ghcr-container-smoke.json\""
        },
        {
          "name": "Publish the fixed version",
          "if": "steps.existing.outputs.reuse != 'true'",
          "env": {
            "PUBLISH_IMAGE": "${{ needs.metadata.outputs.image }}"
          },
          "run": "docker push \"$PUBLISH_IMAGE\"\nprintf 'Published `%s` from `%s` after regression and container smoke checks. Channel refresh follows this successful workflow.\\n' \"$PUBLISH_IMAGE\" \"$GITHUB_SHA\" >> \"$GITHUB_STEP_SUMMARY\""
        }
      ]
    }
  }
}
